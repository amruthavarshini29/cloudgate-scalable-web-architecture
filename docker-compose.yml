version: '3.8'

services:
  # ─── PostgreSQL Database ────────────────────────────────────
  database:
    image: postgres:16-alpine
    container_name: cloudgate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudgate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - cloudgate-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudgate-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: cloudgate
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSL: 'false'
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
    networks:
      - cloudgate-net

  # ─── Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudgate-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cloudgate-net

volumes:
  postgres_data:

networks:
  cloudgate-net:
    driver: bridge
